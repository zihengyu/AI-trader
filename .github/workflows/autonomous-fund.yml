name: Autonomous Fund regression

on:
  push:
    branches: ["version/**"]
    paths:
      - 'scripts/**'
      - 'lumibot/**'
      - 'tests/test_autonomous_fund*.py'
      - 'tests/conftest.py'
      - 'tests/__init__.py'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'setup.*'
      - '.github/workflows/autonomous-fund.yml'
  pull_request:
    branches: [dev, "version/**"]
    paths:
      - 'scripts/**'
      - 'lumibot/**'
      - 'tests/test_autonomous_fund*.py'
      - 'tests/conftest.py'
      - 'tests/__init__.py'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'setup.*'
      - '.github/workflows/autonomous-fund.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AIOHTTP_NO_EXTENSIONS: 1
  BACKTESTING_DATA_SOURCE: none
  LUMIBOT_DISABLE_DOTENV: 'true'

jobs:
  regression:
    name: Fund regression (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            setup.py
            requirements_agent_evals.txt
      - name: Install dependencies
        run: python -m pip install -e . pytest-mock -c requirements_agent_evals.txt
      - name: Run deterministic fund regressions
        run: >-
          python -m pytest -q -m "not apitest and not downloader"
          tests/test_autonomous_fund_approval_recovery.py
          tests/test_autonomous_fund_closed_ledger.py
          tests/test_autonomous_fund_datadesk.py
          tests/test_autonomous_fund_execution_continuity.py
          tests/test_autonomous_fund_execution_quality.py
          tests/test_autonomous_fund_quant.py
          tests/test_autonomous_fund_strategy_lab.py
          tests/test_autonomous_fund_strategy_lab_integrity.py
